<style>
:root{
  color-scheme:dark;
  --bg:#040b12;
  --bg-2:#07121b;
  --card:#0a1620;
  --card-2:#0d1b27;
  --line:rgba(140,190,220,.14);
  --line-strong:rgba(140,190,220,.24);
  --text:#ffffff;
  --muted:#a9b8c6;
  --mint:#1fe6b4;
  --mint-2:#12c9a0;
  --mint-ink:#03241c;
  --violet:#5a2be0;
  --blue:#1b6cff;
  --radius:16px;
  --wrap:1180px;
  --font:"Manrope","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.4;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px;border-radius:6px}
.wrap{width:100%;max-width:var(--wrap);margin:0 auto;padding:0 30px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Header ---------- */
.header{position:relative;z-index:20;border-bottom:1px solid var(--line);background:rgba(4,11,18,.85);backdrop-filter:blur(10px)}
.header .wrap{display:flex;align-items:center;height:80px;gap:40px}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:31px;letter-spacing:-.02em}
.logo svg{width:38px;height:38px}
.nav{display:flex;gap:30px;margin-left:24px;font-size:14.5px;font-weight:600}
.nav a{display:flex;align-items:center;gap:5px;padding:8px 0;color:#eef4f8}
.nav a:hover{color:var(--mint)}
.nav svg{font-size:13px}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:14px}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:20px}
.icon-btn:hover{border-color:var(--mint)}
.btn-outline{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;border:1.5px solid var(--mint);color:var(--mint);font-weight:700;font-size:14px}
.btn-outline svg{font-size:18px}
.btn-outline:hover{background:rgba(31,230,180,.1)}
.burger{display:none;font-size:30px;padding:4px}

/* ---------- Hero ---------- */

  radial-gradient(60% 90% at 85% 40%,rgba(27,108,255,.28),transparent 70%),
  radial-gradient(40% 60% at 70% 80%,rgba(90,43,224,.22),transparent 70%),
  linear-gradient(180deg,#051019,#040b12)}

.hero .wrap{position:relative;padding-top:50px;padding-bottom:130px}
.tag{display:inline-flex;align-items:center;height:32px;padding:0 14px;border:1px solid rgba(31,230,180,.55);border-radius:999px;color:var(--mint);font-size:13.5px;font-weight:700;letter-spacing:.02em;background:rgba(31,230,180,.06)}
.hero h1{margin-top:18px;font-size:clamp(34px,5.1vw,58px);line-height:1.02;font-weight:800;letter-spacing:-.035em;max-width:13em}
.hero h1 span{color:var(--mint)}
.hero p{margin-top:22px;font-size:clamp(17px,2vw,21px);line-height:1.35;color:#e9f0f5;max-width:22em;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 32px;border-radius:999px;background:var(--mint);color:var(--mint-ink);font-weight:800;font-size:18px;margin-top:28px;box-shadow:0 0 28px rgba(31,230,180,.35)}
.btn:hover{background:#43f0c6}
.btn svg{stroke-width:2.4}
.dots{display:none}

/* ---------- Quick nav ---------- */
.quick{position:relative;z-index:5;margin-top:-76px}
.quick ul{display:grid;grid-template-columns:repeat(7,1fr);background:rgba(9,20,30,.88);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:20px;padding:18px 0}
.quick li{position:relative}
.quick li+li::before{content:"";position:absolute;left:0;top:14%;height:72%;width:1px;background:var(--line-strong)}
.quick a{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 8px;font-size:14.5px;font-weight:600;text-align:center}
.quick svg{font-size:36px;color:var(--mint);stroke-width:1.7}
.quick a:hover{color:var(--mint)}

/* ---------- Section heads ---------- */
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.head h2{font-size:28px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:16px}
.head h2::before{content:"";width:6px;height:26px;border-radius:3px;background:var(--mint)}
.more{display:inline-flex;align-items:center;gap:8px;color:var(--mint);font-weight:700;font-size:14px;white-space:nowrap}
.more:hover{text-decoration:underline}
.card{background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line);border-radius:var(--radius)}

/* ---------- News + highlights ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:28px;margin-top:30px;align-items:start}

.feature-body{padding:0 18px 22px;margin-top:-14px;position:relative}
.badge{display:inline-flex;align-items:center;height:28px;padding:0 13px;border-radius:9px;background:var(--mint);color:var(--mint-ink);font-size:12.5px;font-weight:700}
.feature h3{margin-top:14px;font-size:24px;line-height:1.16;font-weight:800;letter-spacing:-.02em}
.meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;margin-top:16px;flex-wrap:wrap}
.meta svg{font-size:17px}
.meta .sep{width:1px;height:14px;background:var(--line-strong);margin:0 6px}
.item{display:flex;align-items:center;gap:24px;padding:26px 24px;min-height:150px}
.item h3{font-size:15.5px;font-weight:700;line-height:1.35}
.item .meta{font-size:11.5px;margin-top:12px;gap:6px}
.item .meta svg{font-size:13px}
.item .chev{display:none;margin-left:auto;color:var(--mint);font-size:30px}
.feature:hover h3,.item:hover h3,.hl li a:hover h3{color:var(--mint)}

/* marca/monograma — troque pelo <img> do logotipo oficial de cada empresa */
.brand{flex:none;width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:22px;letter-spacing:-.02em;color:#fff;background:linear-gradient(140deg,#16314a,#0b1b2a);border:1px solid var(--line-strong)}
.brand.b2{background:linear-gradient(140deg,#1b3f8f,#0c1f4a)}
.brand.b3{background:linear-gradient(140deg,#0f6b58,#0a3a31)}

.hl{padding:20px 16px 14px}
.hl-head{display:flex;align-items:center;gap:10px;padding:0 4px 16px}
.hl-head h2{font-size:19px;font-weight:800;letter-spacing:-.01em}
.hl-head svg{font-size:26px;color:var(--mint);fill:rgba(31,230,180,.25)}
.hl-head .more{display:none;margin-left:auto}
.hl li{border-top:1px solid var(--line)}
.hl li a{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:18px 0;position:relative}
.hl .brand{width:76px;height:76px;margin-left:12px}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--mint);color:var(--mint);font-weight:700;font-size:14px;background:#081a22}
.hl .num{position:absolute;left:0;top:14px;z-index:1}
.hl h3{font-size:13.5px;font-weight:600;line-height:1.45}
.read{display:inline-flex;align-items:center;gap:6px;margin-top:6px;color:var(--mint);font-size:11.5px;font-weight:700}

/* ---------- Newsletter ---------- */
.newsletter{margin-top:30px;position:relative;overflow:hidden;border-top:1px solid rgba(120,90,255,.35);border-bottom:1px solid rgba(120,90,255,.25);
  background:radial-gradient(40% 160% at 100% 60%,rgba(31,230,180,.28),transparent 70%),linear-gradient(95deg,#3a17b0 0%,#2a1396 35%,#111b63 70%,#0a2a4a 100%)}
.newsletter::after{content:"";position:absolute;right:0;top:0;bottom:0;width:30%;opacity:.5;background-image:radial-gradient(rgba(31,230,180,.9) 1px,transparent 1.4px);background-size:9px 9px;-webkit-mask-image:radial-gradient(80% 90% at 100% 60%,#000,transparent 75%);mask-image:radial-gradient(80% 90% at 100% 60%,#000,transparent 75%);pointer-events:none}
.newsletter .wrap{position:relative;z-index:1;display:flex;align-items:center;gap:40px;padding-top:26px;padding-bottom:26px}
.nl-icon{flex:none;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);font-size:56px}
.nl-icon svg{stroke-width:1.4}
.nl-text h2{font-size:21px;font-weight:800;letter-spacing:-.01em}
.nl-text p{margin-top:8px;font-size:13.5px;color:#e4e6fb;max-width:24em}
.nl-form{margin-left:20px;display:flex;flex:0 1 320px;height:46px;background:#fff;border-radius:999px;overflow:hidden}
.nl-form input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:0 20px;font:500 14px var(--font);color:#10202c}
.nl-form input::placeholder{color:#55657a}
.nl-form button{flex:none;padding:0 22px;background:var(--mint);color:var(--mint-ink);font-weight:700;font-size:13.5px;border-radius:999px}
.nl-form button:hover{background:#43f0c6}

/* ---------- Categories + most read ---------- */
.bottom{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:44px;margin-top:28px;align-items:start}
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.cat{overflow:hidden;display:flex;flex-direction:column;height:100%;border-radius:12px}
.cat img{width:100%;aspect-ratio:1.15;object-fit:cover}
.cat span{flex:1;display:grid;place-items:center;text-align:center;padding:10px 6px 12px;font-size:14px;font-weight:600;line-height:1.2;min-height:56px}
.cat:hover{border-color:var(--mint)}
.most h2{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;padding-bottom:10px;border-bottom:1px solid var(--line)}
.most li{border-bottom:1px solid var(--line)}
.most li:last-child{border-bottom:0}
.most a{display:flex;align-items:center;gap:16px;padding:16px 0;font-size:13px;font-weight:600;line-height:1.4}
.most a:hover{color:var(--mint)}
.most .num{width:34px;height:34px;flex:none}
.most a span:nth-child(2){flex:1}
.most a svg{color:var(--mint);font-size:22px}

.wave{height:90px;margin-top:-10px;background:
  radial-gradient(70% 140% at 20% 130%,rgba(31,230,180,.45),transparent 60%),
  radial-gradient(70% 160% at 75% 140%,rgba(90,43,224,.75),transparent 62%),
  radial-gradient(60% 120% at 50% 150%,rgba(27,108,255,.5),transparent 65%)}

/* ================= MOBILE ================= */
@media (max-width:860px){
  .wrap{padding:0 16px}
  .header .wrap{height:72px;gap:12px}
  .logo{font-size:28px;gap:10px}
  .logo svg{width:34px;height:34px}
  .burger{display:block}
  .header-actions{gap:10px}
  .btn-outline{height:40px;padding:0 14px;font-size:13.5px}
  .nav{display:none;position:absolute;top:100%;left:0;right:0;margin:0;flex-direction:column;gap:0;background:#07121b;border-bottom:1px solid var(--line);padding:8px 16px 14px}
  .nav.open{display:flex}
  .nav a{padding:13px 4px;border-bottom:1px solid var(--line);justify-content:space-between;font-size:16px}
  .nav a:last-child{border-bottom:0}

  .hero-art{width:52%;opacity:.9}
  .hero .wrap{padding-top:18px;padding-bottom:66px}
  .tag{height:30px;font-size:12.5px}
  .hero h1{font-size:clamp(27px,8.2vw,40px);max-width:9.5em;margin-top:12px;line-height:1.05}
  .hero p{font-size:clamp(14.5px,4.2vw,19px);max-width:18.5em;margin-top:12px}
  .btn{height:44px;padding:0 26px;font-size:15.5px;margin-top:16px}
  .dots{display:flex;gap:10px;position:absolute;left:50%;bottom:44px;transform:translateX(-50%)}
  .dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3)}
  .dots i:first-child{width:24px;border-radius:6px;background:var(--mint)}

  .quick{margin-top:-30px}
  .quick ul{grid-template-columns:repeat(5,1fr);padding:14px 0;border-radius:18px}
  .quick li.only-desk{display:none}
  .quick a{font-size:clamp(10.5px,3vw,14px);gap:8px;padding:4px 2px;line-height:1.15}
  .quick svg{font-size:clamp(26px,8vw,34px)}

  .head h2{font-size:24px;gap:14px}
  .main{grid-template-columns:1fr;gap:22px;margin-top:22px}
  .news-grid{grid-template-columns:1fr;gap:10px}
  .feature{flex-direction:row;grid-row:auto}
  .feature-img{flex:0 0 46%;height:auto;min-height:150px}
  .feature-body{margin:0;padding:14px 14px 14px 18px;align-self:center}
  .feature h3{font-size:clamp(17px,5.2vw,23px);margin-top:10px}
  .meta{margin-top:10px;font-size:13px}
  .item{min-height:0;padding:14px 20px 14px 14px;gap:20px}
  .item .brand{width:58px;height:58px}
  .item h3{font-size:clamp(14.5px,4.2vw,17.5px);max-width:15em}
  .item .meta{font-size:12.5px;margin-top:6px}
  .item .meta svg{display:none}
  .item .chev{display:block}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}

.section{margin-top:44px}
.article{max-width:780px;margin:0 auto}

.prose h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:34px}
.prose ul{list-style:disc;padding-left:22px;margin-top:14px;color:#d7e1ea;font-size:17px;line-height:1.75}
.prose blockquote{border-left:4px solid var(--mint);padding:6px 0 6px 20px;margin-top:26px;font-size:20px;font-weight:700;line-height:1.4}

.empty{padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:16px}
.nl-ok{font-weight:700;margin-left:20px}
.newsletter{margin-top:34px}
.bottom{margin-bottom:40px}

.fgrid{display:grid;grid-template-columns:1.7fr 1fr 1fr 1fr;gap:30px}
.footer p{color:var(--muted);font-size:14px;line-height:1.55;margin-top:14px;max-width:32ch}
.footer h4{font-size:14px;margin-bottom:10px}
.footer .fgrid a:not(.logo){display:block;color:var(--muted);font-size:14px;padding:4px 0}

.copy{border-top:1px solid var(--line);margin-top:28px;padding-top:18px;color:var(--muted);font-size:13px}

  .section{margin-top:30px}
}

    {slug:"dados",       nome:"Dados",             img:IMG.c2,   icon:"bars"},
    {slug:"mundo",       nome:"Mundo Tech",        img:IMG.c1,   icon:"globe"}
  ],
  posts: RAW.news.items.map(i => ({slug:i.id, cat:i.category, titulo:i.title, resumo:i.summary, data:i.date, tags:i.tags||[], fonte:i.source_name, url:i.url, prioridade:!!i.priority, impacto:i.impact||"", afeta:i.affects||[]})),
  destaques: (RAW.site.highlights||[]),
  datas: RAW.site.dates||[],
  treinamentos: RAW.site.trainings||[],
  atualizado: RAW.news.updated_at
};
/* ======================= fim dos dados ======================= */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic = n => `<svg class="i"><use href="#${n}"/></svg>`;
const MESES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const fmt = d => { const [y,m,dd] = d.split("-"); return `${+dd} de ${MESES[m-1]} de ${y}`; };
const cat = slug => DATA.categorias.find(c => c.slug === slug);
const byDate = (a,b) => b.data.localeCompare(a.data) || a.slug.localeCompare(b.slug);
const posts = (f = () => true) => DATA.posts.filter(f).sort(byDate);
const getPost = s => DATA.posts.find(p => p.slug === s);
const imgOf = p => cat(p.cat).img;
const UPD = new Date(DATA.atualizado);
const updTxt = new Intl.DateTimeFormat("pt-BR",{timeZone:"America/Sao_Paulo",dateStyle:"long",timeStyle:"short"}).format(UPD);
const ageDays = p => (UPD - new Date(p.data+"T12:00:00-03:00"))/864e5;
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const IMP = {alto:"Alto impacto", medio:"Médio impacto"};
const AFETA = {empresas:"Empresas", pessoas:"Pessoas"};
const afetaTxt = p => p.afeta.map(a => AFETA[a] || a).join(" e ");
const impBadge = p => p.impacto ? `<span class="imp ${p.impacto}">${ic("alert")}${IMP[p.impacto]}${p.afeta.length ? " · " + afetaTxt(p) : ""}</span>` : "";
const altoImpacto = (dias=14) => posts(p => p.impacto==="alto" && ageDays(p) <= dias);
const fonteLink = (p, label) => `<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" class="more">${label || esc(p.fonte)} ${ic("ext")}</a>`;

/* ---------- Menu ---------- */
const MENU = [
  {label:"Notícias",     href:"#/noticias",     key:"noticias", sub:[["Todas as notícias","#/noticias"], ...DATA.categorias.map(c => [c.nome, "#/noticias/"+c.slug])]},
  {label:"Mundo Tech",   href:"#/mundo",        key:"mundo"},
  {label:"Agenda",       href:"#/agenda",       key:"agenda"},
  {label:"Treinamentos", href:"#/treinamentos", key:"treinamentos"},
  {label:"Sobre",        href:"#/sobre",        key:"sobre"}
];
function renderNav(active){
  $("#nav").innerHTML = MENU.map(m => `
    <div class="nav-item">
      <a href="${m.href}" class="${active===m.key ? "active":""}">${m.label}${m.sub ? " "+ic("down") : ""}</a>
      ${m.sub ? `<div class="drop">${m.sub.map(([l,h]) => `<a href="${h}">${l}</a>`).join("")}</div>` : ""}
    </div>`).join("");
}

/* ---------- Componentes ---------- */
const postCard = p => `
  <a href="#/post/${p.slug}" class="card pcard">
    <div class="pimg" style="background-image:url('${imgOf(p)}')"><span class="badge">${cat(p.cat).nome}</span></div>
    <div class="pbody">
      ${impBadge(p)}<span class="kind">${p.prioridade ? "★ Prioridade · " : ""}${esc(p.tags.slice(0,2).join(" · "))}</span>
      <h3>${esc(p.titulo)}</h3>
      <p>${esc(p.resumo)}</p>
      <div class="meta">${ic("cal")}${fmt(p.data)} <span class="sep"></span>${ic("ext")}${esc(p.fonte)}</div>
    </div>
  </a>`;
const tcard = (icon, titulo, desc, pills) => `
  <article class="card tcard">
    <span class="ticon">${ic(icon)}</span>
    <h3>${esc(titulo)}</h3>
    <p>${esc(desc)}</p>
    <div class="trow">${pills}</div>
  </article>`;
const dataCard = ([iso,quando,oque,quem]) => tcard("cal", quando, oque, `<span class="pill">${esc(quem)}</span>`);
const treinoCard = ([c,t,d]) => tcard(cat(c) ? cat(c).icon : "book", t, d, `<span class="pill">${cat(c) ? cat(c).nome : esc(c)}</span><span class="pill pend">Aguardando sua aprovação</span>`);
const chips = (items, current) => `<div class="chips">${items.map(([l,h,k]) => `<a href="${h}" class="chip ${k===current?"on":""}">${l}</a>`).join("")}</div>`;
const pageHead = (crumbs, title, lead) => `
  <div class="crumbs"><a href="#/">Início</a>${crumbs.map(([l,h]) => `<span>/</span>${h ? `<a href="${h}">${l}</a>` : `<span>${l}</span>`}`).join("")}</div>
  <h1 class="page-title">${title}</h1>${lead ? `<p class="lead">${lead}</p>` : ""}`;
const grid = (items, card, vazio="Nada por aqui ainda.") => items.length ? `<div class="grid">${items.map(card).join("")}</div>` : `<div class="empty">${vazio}</div>`;
const faixa = () => `
  <section class="newsletter" id="atualizacao">
    <div class="wrap">
      <div class="nl-icon">${ic("clock")}</div>
      <div class="nl-text"><h2>Atualizado em ${updTxt}</h2><p>Horário de Brasília · ${DATA.posts.length} novidades com data e link para a fonte original.</p></div>
      <a href="#/noticias" class="nl-cta">Ver todas as notícias ${ic("arrow")}</a>
    </div>
  </section>`;
const prioridades = (n=3) => `
  <aside class="most">
    <h2><span aria-hidden="true">🔥</span> Prioridades</h2>
    <ol>${posts(p => p.prioridade && !DATA.destaques.includes(p.slug)).slice(0,n).map((p,i) => `<li><a href="#/post/${p.slug}"><span class="num">${i+1}</span><span>${esc(p.titulo)}</span>${ic("right")}</a></li>`).join("")}</ol>
  </aside>`;
const categoriasGrid = () => `<div class="cats">${DATA.categorias.map(c => `<a href="#/noticias/${c.slug}" class="card cat"><img src="${c.img}" alt=""><span>${c.nome}<small>${DATA.posts.filter(p=>p.cat===c.slug).length} itens</small></span></a>`).join("")}</div>`;

/* ---------- Páginas ---------- */
function alertas(){
  const al = altoImpacto().slice(0,4);
  if(!al.length) return "";
  return `
  <section class="wrap alerts" aria-label="Alto impacto">
    <div class="head"><h2><span class="alert-dot" aria-hidden="true"></span>Alto impacto</h2><a href="#/mundo/alto" class="more">Ver Mundo Tech ${ic("arrow")}</a></div>
    <div class="alert-grid">${al.map(p => `
      <a href="#/post/${p.slug}" class="card alert-card">
        <span class="imp alto">${ic("alert")}Alto impacto${p.afeta.length ? " · " + afetaTxt(p) : ""}</span>
        <h3>${esc(p.titulo)}</h3>
        <div class="meta">${ic("cal")}${fmt(p.data)} <span class="sep"></span>${cat(p.cat).nome}</div>
      </a>`).join("")}</div>
  </section>`;
}
function home(){
  const hl = DATA.destaques.map(getPost).filter(Boolean);
  const feat = hl[0] || posts()[0];
  const semana = hl.slice(1,4);
  const usados = new Set([feat, ...semana].map(p => p.slug));
  const side = posts(p => !usados.has(p.slug)).slice(0,2);
  const last7 = DATA.posts.filter(p => ageDays(p) <= 7).length;
  return `
  <section class="hero">
    <div class="hero-art" role="img" aria-label="Chip de IA em neon"></div>
    <div class="wrap">
      <span class="tag">INTELIGÊNCIA ARTIFICIAL</span>
      <h1>Novas ferramentas, grandes <span>possibilidades.</span></h1>
      <p>Explore as últimas novidades em IA, Data e tecnologia para ficar à frente no mercado.</p>
      <a href="#/noticias" class="btn">Ver as novidades ${ic("arrow")}</a>
      <div class="hero-stats"><span><b>${DATA.posts.length}</b> novidades</span><span><b>${last7}</b> nos últimos 7 dias</span><span>Atualizado em ${updTxt}</span></div>
      <div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </div>
  </section>
  <nav class="quick wrap" aria-label="Seções"><ul>
    <li><a href="#/noticias/claude">${ic("star")}Claude</a></li>
    <li><a href="#/noticias/snowflake">${ic("stack")}Snowflake</a></li>
    <li><a href="#/noticias/microsoft">${ic("nodes")}Microsoft Copilot</a></li>
    <li class="only-desk"><a href="#/noticias/modelos">${ic("rocket")}Novas LLMs</a></li>
    <li class="only-desk"><a href="#/noticias/seguranca">${ic("shield")}Segurança</a></li>
    <li><a href="#/mundo">${ic("globe")}Mundo Tech</a></li>
    <li><a href="#/noticias/dados">${ic("bars")}Dados</a></li>
  </ul></nav>

  ${alertas()}

  <div class="wrap main">
    <section>
      <div class="head"><h2>Últimas Notícias</h2><a href="#/noticias" class="more">Ver todas ${ic("arrow")}</a></div>
      <div class="news-grid">
        <a href="#/post/${feat.slug}" class="card feature">
          <div class="feature-img" style="background-image:url('${IMG.brain}')"></div>
          <div class="feature-body"><span class="badge">Destaque · ${cat(feat.cat).nome}</span><h3>${esc(feat.titulo)}</h3>
            <p class="feat-sum">${esc(feat.resumo)}</p>
            <div class="meta">${ic("cal")}${fmt(feat.data)} <span class="sep"></span>${ic("ext")}${esc(feat.fonte)}</div></div>
        </a>
        ${side.map(p => `
        <a href="#/post/${p.slug}" class="card item">
          <span class="brand" style="background-image:url('${imgOf(p)}')"></span>
          <div><h3>${esc(p.titulo)}</h3><div class="meta">${ic("cal")}${fmt(p.data)} <span>•</span> ${cat(p.cat).nome}</div></div>
          ${ic("right").replace('class="i"','class="i chev"')}
        </a>`).join("")}
      </div>
    </section>
    <aside class="card hl">
      <div class="hl-head">${ic("star")}<h2>Destaques da Semana</h2><a href="#/noticias" class="more">Ver todos ${ic("arrow")}</a></div>
      <ol>${semana.map((p,i) => `
        <li><a href="#/post/${p.slug}"><span class="num">${i+1}</span><span class="brand" style="background-image:url('${imgOf(p)}')"></span>
          <div><h3>${esc(p.titulo)}</h3><span class="read">Ler matéria ${ic("arrow")}</span></div></a></li>`).join("")}</ol>
    </aside>
  </div>

  ${faixa()}

  <div class="wrap bottom">
    <section>
      <div class="head"><h2>Categorias</h2><a href="#/noticias" class="more">Ver todas ${ic("arrow")}</a></div>
      ${categoriasGrid()}
    </section>
    ${prioridades()}
  </div>

  <div class="wrap" style="margin-bottom:46px">
    <section class="section">
      <div class="head"><h2>Treinamentos sugeridos</h2><a href="#/treinamentos" class="more">Ver todos ${ic("arrow")}</a></div>
      ${grid(DATA.treinamentos.slice(0,3), treinoCard)}
    </section>
    <section class="section">
      <div class="head"><h2>Próximas datas</h2><a href="#/agenda" class="more">Ver agenda ${ic("arrow")}</a></div>
      ${grid(DATA.datas.slice(0,3), dataCard)}
    </section>
  </div>`;
}

const shell = inner => `<div class="wrap page">${inner}</div>${faixa()}<div style="height:40px"></div>`;
const PERIODOS = [["Todo o período",""],["Últimos 7 dias","7"],["Últimos 14 dias","14"],["Últimos 30 dias","30"]];

function noticias(c, per){
  const k = c && cat(c) ? c : "";
  const d = ["7","14","30"].includes(per) ? per : "";
  const base = k || "todas";
  const list = posts(p => (!k || p.cat===k) && (!d || ageDays(p) <= +d));
  return shell(pageHead([["Notícias", k ? "#/noticias" : ""], ...(k ? [[cat(k).nome]] : [])], k ? "Notícias de "+cat(k).nome : "Notícias", "O que aconteceu de mais importante em IA, Dados e tecnologia. Cada item leva à fonte original.")
    + chips([["Todas","#/noticias/todas/"+d,""], ...DATA.categorias.map(x => [`${x.nome} <small>${DATA.posts.filter(p=>p.cat===x.slug).length}</small>`,"#/noticias/"+x.slug+"/"+d,x.slug])], k)
    + `<div class="chips chips-sm">${PERIODOS.map(([l,v]) => `<a href="#/noticias/${base}/${v}" class="chip ${v===d?"on":""}">${l}</a>`).join("")}<span class="count">${list.length} de ${DATA.posts.length} itens</span></div>`
    + grid(list, postCard, "Nenhuma notícia com esses filtros. Tente outra categoria ou período."));
}
function mundo(imp, af){
  const i = ["alto","medio"].includes(imp) ? imp : "";
  const a = ["empresas","pessoas"].includes(af) ? af : "";
  const all = posts(p => p.cat==="mundo" || p.impacto);
  const list = all.filter(p => (!i || p.impacto===i) && (!a || p.afeta.includes(a)));
  const bi = i || "todos";
  return shell(pageHead([["Mundo Tech"]], "Mundo Tech", "Tecnologia em geral com grande impacto em empresas e pessoas: quedas de serviços, vazamentos, falhas de acesso e credenciais, incidentes de nuvem e regulação.")
    + chips([["Todos os impactos","#/mundo/todos/"+a,""],["Alto impacto","#/mundo/alto/"+a,"alto"],["Médio impacto","#/mundo/medio/"+a,"medio"]], i)
    + `<div class="chips chips-sm">${[["Empresas e pessoas",""],["Empresas","empresas"],["Pessoas","pessoas"]].map(([l,v]) => `<a href="#/mundo/${bi}/${v}" class="chip ${v===a?"on":""}">${l}</a>`).join("")}<span class="count">${list.length} de ${all.length} itens</span></div>`
    + grid(list, postCard, "Nenhum item com esses filtros."));
}
function agenda(){
  return shell(pageHead([["Agenda"]], "Próximas datas", "Prazos e eventos que afetam o ambiente.")
    + `<section class="section">${grid(DATA.datas, dataCard)}</section>`);
}
function treinamentos(){
  return shell(pageHead([["Treinamentos"]], "Treinamentos sugeridos", "Temas candidatos a partir das novidades, com Snowflake e Claude primeiro. Nenhum treinamento foi criado: todos aguardam sua aprovação.")
    + `<section class="section">${grid(DATA.treinamentos, treinoCard)}</section>`);
}
function post(slug){
  const p = getPost(slug); if(!p) return naoEncontrado();
  const c = cat(p.cat);
  const rel = posts(x => x.cat===p.cat && x!==p).slice(0,3);
  return `<div class="wrap page">
    <article class="article">
      ${pageHead([["Notícias","#/noticias"],[c.nome,"#/noticias/"+c.slug]], esc(p.titulo), esc(p.resumo))}
      <div class="meta" style="margin-top:18px"><span class="badge">${c.nome}</span>${ic("cal")}${fmt(p.data)} <span class="sep"></span>${ic("ext")}${esc(p.fonte)}${p.prioridade ? ` <span class="sep"></span>★ Prioridade` : ""}</div>
      ${p.impacto ? `<div style="margin-top:12px">${impBadge(p)}</div>` : ""}
      <div class="article-img" style="background-image:url('${IMG.brain}')" role="img" aria-label="${c.nome}"></div>
      <div class="prose">
        <div class="chips">${p.tags.map(t => `<span class="chip">#${esc(t)}</span>`).join("")}</div>
        <p><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" class="btn">Ler na fonte: ${esc(p.fonte)} ${ic("ext")}</a></p>
      </div>
    </article>
    ${rel.length ? `<section class="section"><div class="head"><h2>Relacionadas</h2><a href="#/noticias/${c.slug}" class="more">Ver ${c.nome} ${ic("arrow")}</a></div>${grid(rel, postCard)}</section>` : ""}
  </div>${faixa()}<div style="height:40px"></div>`;
}
function busca(q){
  q = decodeURIComponent(q || "").trim();
  const t = norm(q);
  const ps = t ? posts(p => norm(p.titulo+" "+p.resumo+" "+p.tags.join(" ")+" "+p.fonte+" "+cat(p.cat).nome+" "+(p.impacto ? IMP[p.impacto]+" "+afetaTxt(p) : "")).includes(t)) : [];
  return shell(pageHead([["Busca"]], `Resultados para “${esc(q)}”`, `${ps.length} resultado(s) encontrado(s).`)
    + `<section class="section">${grid(ps, postCard, "Nenhum conteúdo encontrado. Tente outro termo.")}</section>`);
}
function sobre(){
  return shell(pageHead([["Sobre"]], "Sobre o RADARNEXO", "Um radar para acompanhar o que realmente importa em Inteligência Artificial, Dados e tecnologia — sem ruído.")
    + `<div class="prose" style="max-width:760px">
        <p>O RADARNEXO reúne novidades de modelos, Claude, Snowflake, Microsoft Copilot, ferramentas, segurança e dados. Cada item tem data de publicação, um resumo em português e o link para a fonte original. A página é atualizada diariamente.</p>
      </div>
      <section class="section"><div class="grid">
        <article class="card tcard"><span class="ticon">${ic("search")}</span><h3>Curadoria</h3><p>Só entram novidades confirmadas na página da fonte, com data verificada.</p></article>
        <article class="card tcard"><span class="ticon">${ic("wrench")}</span><h3>Prática</h3><p>Temas de treinamento sugeridos a partir das novidades, para avaliar.</p></article>
        <article class="card tcard"><span class="ticon">${ic("clock")}</span><h3>Atualização</h3><p>Última atualização em ${updTxt} (horário de Brasília).</p></article>
      </div></section>
      <section class="section"><div class="head"><h2>Categorias</h2></div>${categoriasGrid()}</section>`);
}
function naoEncontrado(){
  return shell(pageHead([["Página não encontrada"]], "Página não encontrada", "O endereço pode ter mudado ou o conteúdo foi removido.") + `<p style="margin-top:22px"><a href="#/" class="btn">Voltar ao início ${ic("arrow")}</a></p>`);
}

/* ---------- Roteador (por hash: #/noticias, #/post/id …) ---------- */
const ROTAS = {"":home, noticias, mundo, agenda, treinamentos, post, busca, sobre, categoria:(s)=>noticias(s)};
const TITULOS = {"":"Notícias de IA, Dados e Tecnologia", noticias:"Notícias", mundo:"Mundo Tech", agenda:"Agenda", treinamentos:"Treinamentos", busca:"Busca", sobre:"Sobre", categoria:"Notícias"};
function rota(){
  const h = location.hash;
  if(!h.startsWith("#/") && h.length > 1) return;
  const [nome="", arg="", arg2=""] = h.replace(/^#\/?/,"").split("/");
  const fn = ROTAS[nome] || naoEncontrado;
  $("#app").innerHTML = fn(arg, arg2);
  renderNav(nome === "post" || nome === "categoria" ? "noticias" : nome);
  const p = nome==="post" && getPost(arg);
  document.title = (p ? p.titulo : TITULOS[nome] || "Página não encontrada") + " — RADARNEXO";
  $("#nav").classList.remove("open"); $("#burger").setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", rota);

/* ---------- Interações ---------- */
$("#burger").addEventListener("click", () => { const o = $("#nav").classList.toggle("open"); $("#burger").setAttribute("aria-expanded", o); });
$("#searchBtn").addEventListener("click", () => { const o = $("#searchbar").classList.toggle("open"); $("#searchBtn").setAttribute("aria-expanded", o); if(o) $("#q").focus(); });
$("#searchForm").addEventListener("submit", e => { e.preventDefault(); const q = $("#q").value.trim(); if(q){ location.hash = "#/busca/" + encodeURIComponent(q); $("#searchbar").classList.remove("open"); } });
document.addEventListener("click", e => {
  const a = e.target.closest("[data-scroll]"); if(!a) return;
  e.preventDefault(); const el = document.getElementById(a.dataset.scroll); if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
});
$("#footCats").innerHTML = DATA.categorias.map(c => `<a href="#/noticias/${c.slug}">${c.nome}</a>`).join("");
$("#footUpd").textContent = `© 2026 RADARNEXO · Atualizado em ${updTxt} (horário de Brasília) · ${DATA.posts.length} itens com fonte.`;
rota();
</script>

</body>
</html>
